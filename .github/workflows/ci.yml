name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  aislop:
    name: aislop (AI-slop gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pinned: @latest drifts. 0.14.x rescored the same known-structural
      # warnings from 89 to 84, below the failBelow: 86 ratchet, turning every
      # PR red without a line of new slop. Bump deliberately, with the score.
      - run: npx --yes aislop@0.13.1 ci

  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt ruff pytest pytest-asyncio aiosqlite pytest-randomly==4.1.0
      - run: ruff check .
      - run: ruff check --config ruff.toml ../bot
      # Shuffled order, so state leaking between tests fails here and not only on
      # whoever happens to run the suite locally. No -q: the header prints the
      # seed — replay a red run with `python -m pytest --randomly-seed=N`.
      - run: python -m pytest
      - name: ty (static typing)
        run: pip install ty && ty check .
      - name: deptry (unused deps)
        run: pip install deptry && deptry .
      - name: pip-audit (advisory)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt

  miniapp:
    name: miniapp (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/miniapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/miniapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: knip (dead files/exports/deps)
        run: npx knip
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  admin:
    name: admin (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: knip (dead files/exports/deps)
        run: npx knip
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: raven-actions/actionlint@v2

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
